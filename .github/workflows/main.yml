name: Build and Deploy Node.js API to Azure - Pleis

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      # Deploy to staging slot first (users stay on current production)
      - name: Deploy to Azure Web App (API — Pleis / stagging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Pleis'
          slot-name: 'stagging'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_STAGING }}
          package: .

      # Wait until staging finishes cold start / setup and is healthy
      - name: Wait for staging /health
        run: |
          URL="https://pleis-stagging-b7fuf4cghvhacadu.germanywestcentral-01.azurewebsites.net/health"
          echo "Waiting for $URL"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "Staging healthy (HTTP 200) after attempt $i"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $code — waiting 15s..."
            sleep 15
          done
          echo "Staging did not become healthy within 15 minutes"
          exit 1

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap stagging → production
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --resource-group pleis \
              --name Pleis \
              --slot stagging \
              --target-slot production

