name: Deploy Node.js API to Azure Web App - Pleis

on:
  push:
    branches:
      - module/organizer-dashboard
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Install dependencies (production only)
      - name: Install dependencies
        run: npm ci --only=production

      # 4. Upload artifact for deployment
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./backend-dev/
            !.git/
            !node_modules.tar.gz
            !_del_node_modules

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 1. Download artifact from build job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # 2. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        env:
          SCM_DO_BUILD_DURING_DEPLOYMENT: true
        with:
          app-name: 'Pleis'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D6B5A721CC1F4065BA303A78D3C5B578 }}
          package: ./

