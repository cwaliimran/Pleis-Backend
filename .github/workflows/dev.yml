name: Deploy Node.js API to Azure Web App - Pleis-backend-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Ensure lock file is up to date
      - name: Update lock file
        run: npm install --package-lock-only

      # 4. Install all dependencies (including nodemon)
      - name: Install dependencies
        run: npm ci

      # 4. Upload artifact for deployment
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1. Download artifact from build job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app


      # 3. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        env:
          SCM_DO_BUILD_DURING_DEPLOYMENT: true
        with:
          app-name: 'Pleis-backend-dev'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8DE223AF70D74AE6A51EEF16D991C7F0 }}
          package: ./