name: Build and Deploy Node.js API to Azure - Pleis-backend-dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Deploy to Azure Web App (API — Pleis-backend-dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Pleis-backend-dev'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8DE223AF70D74AE6A51EEF16D991C7F0 }}
          package: .

      - name: Deploy to Azure Web App (Worker — Pleis-backend-dev-worker)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Pleis-backend-dev-worker'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PLEIS_BACKEND_DEV_WORKER }}
          package: .