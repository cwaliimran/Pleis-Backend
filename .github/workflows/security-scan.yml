name: Security Scan

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Runs before any install. The scanner reads files as text and uses Node built-ins only.
      - name: Scan for malicious code
        run: node scripts/security/scanRepo.js --all

      - name: Reject force pushes
        if: always() && github.event_name == 'push' && github.event.forced
        run: |
          echo "::error::Branch history was rewritten by a force push. Verify who did this before trusting it."
          exit 1
