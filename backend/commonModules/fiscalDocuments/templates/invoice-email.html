<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{EMAIL_TITLE}}</title>
</head>
<body style="margin:0;padding:0;background:#F4F5F7;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {{EMAIL_PREHEADER}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F5F7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#14181F;">
          <tr>
            <td style="background:#10368A;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:700;">
              Pleis
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px;font-size:22px;font-weight:700;line-height:1.3;">
              {{EMAIL_HEADING}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 16px;font-size:14px;line-height:1.6;color:#3A4050;">
              {{EMAIL_INTRO}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F8FA;border-radius:8px;">
                <tr>
                  <td style="padding:14px 16px;font-size:13px;color:#5B6270;">{{LBL_VENUE}}</td>
                  <td align="right" style="padding:14px 16px;font-size:13px;font-weight:700;color:#14181F;">{{VENUE_NAME}}</td>
                </tr>
                <tr>
                  <td style="padding:0 16px 14px;font-size:13px;color:#5B6270;">{{LBL_ORDER}}</td>
                  <td align="right" style="padding:0 16px 14px;font-size:13px;font-weight:700;color:#14181F;">{{ORDER_REFERENCE}}</td>
                </tr>
                <tr>
                  <td style="padding:0 16px 14px;font-size:13px;color:#5B6270;">{{LBL_INVOICES}}</td>
                  <td align="right" style="padding:0 16px 14px;font-size:13px;font-weight:700;color:#14181F;">{{INVOICE_NUMBERS}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 8px;font-size:14px;line-height:1.6;color:#3A4050;">
              {{EMAIL_ATTACH_NOTE}}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:18px 28px 28px;">
              <a href="{{APP_DEEPLINK}}" style="display:inline-block;background:#D0E4FF;color:#10368A;text-decoration:none;font-size:14px;font-weight:700;padding:12px 18px;border-radius:8px;">
                {{OPEN_IN_APP}}
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;font-size:11.5px;line-height:1.6;color:#8A8F9E;border-top:1px solid #E6E8EE;">
              <div style="padding-top:16px;">
                {{EMAIL_FOOTER}} <a href="mailto:{{SUPPORT_EMAIL}}" style="color:#5B6270;">{{SUPPORT_EMAIL}}</a>.
              </div>
            </td>
          </tr>
        </table>
        <div style="max-width:600px;margin:14px auto 0;font-size:11px;color:#9AA0AE;text-align:center;">
          {{PLEIS_LEGAL_NAME}} · {{PLEIS_WEB}}
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
