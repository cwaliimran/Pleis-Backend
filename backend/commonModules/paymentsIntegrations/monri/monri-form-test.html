<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monri card form test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
        color: #111;
      }
      label {
        display: block;
        font-size: 12px;
        margin-top: 8px;
        color: #444;
      }
      textarea,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-top: 4px;
        font-family: ui-monospace, monospace;
      }
      textarea {
        min-height: 280px;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      .hint {
        background: #f4f4f4;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.4;
      }
      .error {
        color: #b00020;
        margin-top: 8px;
        font-size: 14px;
      }
      code {
        background: #eee;
        padding: 1px 4px;
      }
    </style>
  </head>
  <body>
    <h1>Monri card form test</h1>
    <p class="hint">
      Paste the <code>web-pay-session</code> JSON, then click
      <strong>Open payment form</strong>. The page asks Monri for
      <code>payment_url</code> and opens it with GET (a form POST to
      <code>/v2/form</code> redirects with POST and 404s).
    </p>

    <label>
      web-pay-session JSON
      <textarea id="session-json">{
    "authenticity_token": "14bf739fca468f153cea8159f1b1f381e25f684c",
    "transaction_type": "purchase",
    "order_number": "6a9aa5be36b75e5f3e05df6d",
    "order_info": "App payment",
    "amount": "3000",
    "currency": "EUR",
    "language": "en",
    "digest": "8b1d4ced5d521d6008fc1e673e2352eb251206ffc0bd6347599f6fb8e6de9e8c3d963e806aeb21b361ed86761f8f2e9be0070beafa48060a42c5ee3f02631a4f",
    "success_url_override": "https://pleis-bmgwc0exbmdzc8cn.germanywestcentral-01.azurewebsites.net/api/v1/app/payments/monri/success",
    "cancel_url_override": "https://pleis-bmgwc0exbmdzc8cn.germanywestcentral-01.azurewebsites.net/api/v1/app/payments/monri/cancel",
    "supported_payment_methods": "card",
    "ch_full_name": "Ahmad khan",
    "ch_address": "123 Main Street",
    "ch_city": "Lahore",
    "ch_zip": "182626",
    "ch_country": "pk",
    "ch_email": "ahmad@mail.com",
    "ch_phone": ""
}</textarea>
    </label>
    <div id="parse-error" class="error"></div>
    <button type="button" id="open-form">Open payment form</button>

    <script>
      const SKIP_KEYS = new Set([
        "clientSecret",
        "trx_token",
        "locale",
        "environment",
      ]);

      document.getElementById("open-form").addEventListener("click", async () => {
        const errorEl = document.getElementById("parse-error");
        const button = document.getElementById("open-form");
        errorEl.textContent = "";

        let session;
        try {
          session = JSON.parse(document.getElementById("session-json").value);
        } catch (err) {
          errorEl.textContent = "Invalid JSON: " + err.message;
          return;
        }

        if (!session || typeof session !== "object") {
          errorEl.textContent = "JSON must be an object.";
          return;
        }

        const body = new URLSearchParams();
        Object.entries(session).forEach(([key, value]) => {
          if (SKIP_KEYS.has(key) || value === undefined || value === null) {
            return;
          }
          body.append(key, String(value));
        });

        button.disabled = true;
        button.textContent = "Loading…";

        try {
          const res = await fetch("https://ipgtest.monri.com/v2/form", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              Accept: "application/json",
            },
            body,
          });

          const data = await res.json();
          if (!res.ok || !data.payment_url) {
            errorEl.textContent =
              "Monri error: " + JSON.stringify(data.errors || data);
            button.disabled = false;
            button.textContent = "Open payment form";
            return;
          }

          window.location.href = data.payment_url;
        } catch (err) {
          errorEl.textContent = "Request failed: " + err.message;
          button.disabled = false;
          button.textContent = "Open payment form";
        }
      });
    </script>
  </body>
</html>
