<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Pleis card payment</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f6f7;
        color: #111;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px 32px;
      }
      h1 {
        font-size: 20px;
        font-weight: 650;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #444;
        line-height: 1.45;
        font-size: 15px;
      }
      .card {
        margin-top: 20px;
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #ddd;
        border-top-color: #111;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 8px auto 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #b00020;
        font-size: 14px;
        margin-top: 12px;
        white-space: pre-wrap;
      }
      details {
        margin-top: 24px;
        font-size: 13px;
        color: #555;
      }
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        min-height: 160px;
        margin-top: 8px;
        padding: 8px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      button {
        margin-top: 12px;
        padding: 12px;
        font-size: 16px;
        border: 0;
        border-radius: 10px;
        background: #111;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Secure card payment</h1>
      <p id="status-text">Opening Monri payment form…</p>
      <div class="card" id="loader">
        <div class="spinner"></div>
        <p style="text-align: center">Do not close this screen.</p>
      </div>
      <div id="parse-error" class="error"></div>
      <details id="debug-panel">
        <summary>Desktop test: paste web-pay-session JSON</summary>
        <textarea id="session-json" placeholder='{"payment_url":"https://..."}'></textarea>
        <button type="button" id="open-form">Open payment form</button>
      </details>
    </div>

    <script>
      const SKIP_KEYS = new Set([
        "clientSecret",
        "trx_token",
        "locale",
        "environment",
        "payment_url",
        "form_action",
      ]);

      function notifyApp(payload) {
        try {
          if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
            window.ReactNativeWebView.postMessage(JSON.stringify(payload));
          }
        } catch (err) {}
      }

      function showError(message) {
        const errorEl = document.getElementById("parse-error");
        const status = document.getElementById("status-text");
        const loader = document.getElementById("loader");
        errorEl.textContent = message;
        status.textContent = "Could not open payment form";
        loader.style.display = "none";
        notifyApp({ type: "monri_form_error", message });
      }

      async function openMonriCardForm(session) {
        if (!session || typeof session !== "object") {
          showError("Missing web-pay-session.");
          return;
        }

        if (session.payment_url) {
          notifyApp({
            type: "monri_form_opening",
            order_number: session.order_number || null,
          });
          window.location.replace(session.payment_url);
          return;
        }

        const formAction =
          session.form_action || "https://ipgtest.monri.com/v2/form";
        const body = new URLSearchParams();
        Object.entries(session).forEach(([key, value]) => {
          if (SKIP_KEYS.has(key) || value === undefined || value === null) {
            return;
          }
          body.append(key, String(value));
        });

        const res = await fetch(formAction, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            Accept: "application/json",
          },
          body,
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.payment_url) {
          showError("Monri error: " + JSON.stringify(data.errors || data));
          return;
        }

        notifyApp({
          type: "monri_form_opening",
          order_number: session.order_number || data.order_number || null,
        });
        window.location.replace(data.payment_url);
      }

      window.startMonriCardForm = function startMonriCardForm(session) {
        openMonriCardForm(session).catch((err) => {
          showError("Request failed: " + (err && err.message ? err.message : err));
        });
      };

      document.addEventListener("DOMContentLoaded", () => {
        if (window.MONRI_WEB_PAY_SESSION) {
          document.getElementById("debug-panel").style.display = "none";
          window.startMonriCardForm(window.MONRI_WEB_PAY_SESSION);
        }

        document.getElementById("open-form").addEventListener("click", () => {
          const errorEl = document.getElementById("parse-error");
          errorEl.textContent = "";
          try {
            const session = JSON.parse(
              document.getElementById("session-json").value,
            );
            window.startMonriCardForm(session);
          } catch (err) {
            showError("Invalid JSON: " + err.message);
          }
        });
      });
    </script>
  </body>
</html>
